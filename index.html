<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="A fast, private Markdown editor and live preview that runs entirely in your browser. Write, format, preview, copy, and download Markdown or HTML."
		/>
		<meta name="theme-color" content="#f0efec" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1a191d" media="(prefers-color-scheme: dark)" />
		<meta property="og:title" content="Markdown Toolkit — Free Markdown Editor & Preview" />
		<meta
			property="og:description"
			content="A fast, private Markdown editor and live preview that runs entirely in your browser. Write, format, preview, copy, and download Markdown or HTML."
		/>
		<meta property="og:type" content="website" />
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:title" content="Markdown Toolkit — Free Markdown Editor & Preview" />
		<meta
			name="twitter:description"
			content="A fast, private Markdown editor and live preview that runs entirely in your browser. Write, format, preview, copy, and download Markdown or HTML."
		/>
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<script>
			try {
				const savedTheme = localStorage.getItem('markdown-toolkit:theme')
				const theme =
					savedTheme === 'light' || savedTheme === 'dark'
						? savedTheme
						: matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light'
				document.documentElement.dataset.theme = theme
			} catch {
				document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)')
					.matches
					? 'dark'
					: 'light'
			}
		</script>
		<title>Markdown Toolkit — Free Markdown Editor &amp; Preview</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
