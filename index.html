		/>

			content="Markdown Toolkit private Markdown editor and preview"

		<meta name="twitter:card" content="summary_large_image" />

			name="twitter:description"
			content="Write, format, preview, and export Markdown privately in your browser, with Mermaid diagrams and optional Chrome built-in AI."

		/>

			content="Markdown Toolkit private Markdown editor and preview"
		/>
		<link rel="canonical" href="https://markdown-toolkit.pages.dev/" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<script>
			try {
				const savedTheme = localStorage.getItem('markdown-toolkit:theme')
				const theme =
					savedTheme === 'light' || savedTheme === 'dark'
						? savedTheme
						: matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light'
				document.documentElement.dataset.theme = theme
			} catch {
				document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)')
					.matches
					? 'dark'
					: 'light'
			}
		</script>
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "SoftwareApplication",
				"name": "Markdown Toolkit",
				"description": "Write, format, preview, and export Markdown privately in your browser, with Mermaid diagrams and optional Chrome built-in AI.",
				"url": "https://markdown-toolkit.pages.dev/",
				"applicationCategory": "DeveloperApplication",
				"operatingSystem": "Web",
				"author": {
					"@type": "Person",
					"name": "Mohan Pattar",
					"url": "https://github.com/mpMohAn"
				},
				"codeRepository": "https://github.com/mpMohAn/markdown-toolkit",
				"offers": {
					"@type": "Offer",
					"price": "0",
					"priceCurrency": "USD"
				},
				"featureList": [
					"Markdown editing",
					"Live sanitized preview",
					"Deterministic Markdown formatting",
					"Mermaid diagram preview",
					"Local browser autosave",
					"Markdown and HTML copy/download",
					"Optional Chrome built-in AI writing",
					"Light and dark themes"
				]
			}
		</script>
		<title>Markdown Toolkit — Private Markdown Editor</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
